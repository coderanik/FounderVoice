services:
  - type: web
    name: foundervoice-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: STT_BACKEND
        value: elevenlabs
      - key: AUDIO_DENOISE
        value: "false"
      - key: ELEVENLABS_STT_MODEL
        value: scribe_v2
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: WHISPER_MODEL
        value: whisper-1
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
