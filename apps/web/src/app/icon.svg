<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="fav-depth" cx="50%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#161d36" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#090d19" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#04060b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="fav-wave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="fav-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fav-mid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="fav-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="fav-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#fav-depth)"/>
  <rect width="510" height="510" x="1" y="1" rx="115" stroke="rgba(255,255,255,0.14)" stroke-width="2" fill="none"/>
  <circle cx="290" cy="210" r="130" fill="#4f46e5" opacity="0.18" filter="url(#fav-glow)"/>

  <rect x="106" y="224" width="12" height="64" rx="6" fill="url(#fav-wave)" opacity="0.45"/>
  <rect x="128" y="184" width="14" height="144" rx="7" fill="url(#fav-wave)" opacity="0.8"/>
  <rect x="152" y="132" width="22" height="248" rx="11" fill="url(#fav-wave)"/>
  <rect x="184" y="204" width="14" height="104" rx="7" fill="url(#fav-wave)" opacity="0.75"/>

  <path d="M 163 148 L 336 148" stroke="url(#fav-top)" stroke-width="22" stroke-linecap="round"/>
  <path d="M 324 192 L 388 128 L 324 64" fill="none" stroke="url(#fav-arrow)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="280" y1="128" x2="384" y2="128" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>

  <path d="M 163 252 L 278 252" stroke="url(#fav-mid)" stroke-width="20" stroke-linecap="round"/>
  <line x1="278" y1="252" x2="340" y2="204" stroke="#818cf8" stroke-width="4" stroke-dasharray="6 6" opacity="0.8"/>
  <line x1="278" y1="252" x2="330" y2="304" stroke="#38bdf8" stroke-width="4" opacity="0.6"/>

  <circle cx="163" cy="148" r="9" fill="#38bdf8" filter="url(#fav-glow)"/>
  <circle cx="163" cy="148" r="4.5" fill="#ffffff"/>
  <circle cx="280" cy="148" r="10" fill="#818cf8" filter="url(#fav-glow)"/>
  <circle cx="280" cy="148" r="5" fill="#ffffff"/>
  <circle cx="388" cy="128" r="12" fill="#c084fc" filter="url(#fav-glow)"/>
  <circle cx="388" cy="128" r="6" fill="#ffffff"/>
  <circle cx="278" cy="252" r="11" fill="#06b6d4" filter="url(#fav-glow)"/>
  <circle cx="278" cy="252" r="5.5" fill="#ffffff"/>
  <circle cx="340" cy="204" r="9" fill="#818cf8" filter="url(#fav-glow)"/>
  <circle cx="340" cy="204" r="4.5" fill="#ffffff"/>
  <circle cx="330" cy="304" r="8" fill="#38bdf8" filter="url(#fav-glow)"/>
  <circle cx="330" cy="304" r="4" fill="#ffffff"/>
  <circle cx="163" cy="252" r="9" fill="#2563eb" filter="url(#fav-glow)"/>
  <circle cx="163" cy="252" r="4" fill="#ffffff"/>
</svg>
