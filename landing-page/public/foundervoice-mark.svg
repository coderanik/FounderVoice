<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Radiant Depth -->
    <radialGradient id="fv-bg-depth" cx="50%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#161d36" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#090d19" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#04060b" stop-opacity="1"/>
    </radialGradient>

    <!-- Voice Soundwave Stem Gradient -->
    <linearGradient id="fv-wave-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Upper Branch ("F" top beam & pitch vector) -->
    <linearGradient id="fv-top-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Mid Branch ("F" claim graph network) -->
    <linearGradient id="fv-mid-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Dynamic Vector Arrow Gradient -->
    <linearGradient id="fv-arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Node Bioluminescent Glow -->
    <filter id="fv-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Elevation Shadow -->
    <filter id="fv-elevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#3b82f6" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Premium Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#fv-bg-depth)"/>
  <rect width="510" height="510" x="1" y="1" rx="115" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none"/>

  <!-- Subtle Atmospheric Accent Light -->
  <circle cx="290" cy="210" r="140" fill="#4f46e5" opacity="0.16" filter="url(#fv-glow)"/>
  <circle cx="160" cy="270" r="90" fill="#06b6d4" opacity="0.14" filter="url(#fv-glow)"/>

  <!-- THE FOUNDERVOICE "F" MARK -->
  <g filter="url(#fv-elevation)">
    <!-- 1. LEFT PILLAR: Voice Waveforms synthesizing into Founder authority -->
    <!-- Voice Bar 1 (Microphone resonance) -->
    <rect x="106" y="224" width="12" height="64" rx="6" fill="url(#fv-wave-grad)" opacity="0.45"/>

    <!-- Voice Bar 2 (Mid-harmonic pitch) -->
    <rect x="128" y="184" width="14" height="144" rx="7" fill="url(#fv-wave-grad)" opacity="0.8"/>

    <!-- Voice Bar 3 (Main Spine / Stem of 'F') -->
    <rect x="152" y="132" width="22" height="248" rx="11" fill="url(#fv-wave-grad)"/>

    <!-- Voice Bar 4 (Echo resonance between bars) -->
    <rect x="184" y="204" width="14" height="104" rx="7" fill="url(#fv-wave-grad)" opacity="0.75"/>

    <!-- 2. TOP ARM OF 'F': Spoken Vision transforming into Ascending Trajectory -->
    <!-- Upper horizontal arm -->
    <path d="M 163 148 L 336 148"
          stroke="url(#fv-top-beam)"
          stroke-width="22"
          stroke-linecap="round"/>

    <!-- Upward Pitch Arrow Vector (Rule Your Pitch) -->
    <path d="M 324 192 L 388 128 L 324 64"
          fill="none"
          stroke="url(#fv-arrow-grad)"
          stroke-width="20"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <line x1="280" y1="128" x2="384" y2="128"
          stroke="#38bdf8"
          stroke-width="12"
          stroke-linecap="round"/>

    <!-- 3. MIDDLE ARM OF 'F': Structured Claim Graph Network -->
    <!-- Middle crossbar branching out -->
    <path d="M 163 252 L 278 252"
          stroke="url(#fv-mid-beam)"
          stroke-width="20"
          stroke-linecap="round"/>

    <!-- Claim Graph diagonal linkages -->
    <line x1="278" y1="252" x2="340" y2="204"
          stroke="#818cf8"
          stroke-width="4"
          stroke-dasharray="6 6"
          opacity="0.8"/>

    <line x1="278" y1="252" x2="330" y2="304"
          stroke="#38bdf8"
          stroke-width="4"
          opacity="0.6"/>

    <line x1="340" y1="204" x2="336" y2="148"
          stroke="#a78bfa"
          stroke-width="3"
          stroke-dasharray="4 4"
          opacity="0.5"/>

    <!-- 4. CLAIM GRAPH CONSTELLATION NODES (Verified facts & insights) -->
    <!-- Node: Voice Anchor (Origin) -->
    <circle cx="163" cy="148" r="9" fill="#38bdf8" filter="url(#fv-glow)"/>
    <circle cx="163" cy="148" r="4.5" fill="#ffffff"/>

    <!-- Node: Upper Arm Pivot -->
    <circle cx="280" cy="148" r="10" fill="#818cf8" filter="url(#fv-glow)"/>
    <circle cx="280" cy="148" r="5" fill="#ffffff"/>

    <!-- Node: Launch Vector Summit -->
    <circle cx="388" cy="128" r="12" fill="#c084fc" filter="url(#fv-glow)"/>
    <circle cx="388" cy="128" r="6" fill="#ffffff"/>

    <!-- Node: Mid-Arm Claim Graph Hub -->
    <circle cx="278" cy="252" r="11" fill="#06b6d4" filter="url(#fv-glow)"/>
    <circle cx="278" cy="252" r="5.5" fill="#ffffff"/>

    <!-- Node: Diligence Validator (Upper mid satellite) -->
    <circle cx="340" cy="204" r="9" fill="#818cf8" filter="url(#fv-glow)"/>
    <circle cx="340" cy="204" r="4.5" fill="#ffffff"/>

    <!-- Node: Unit Economics Proof (Lower satellite) -->
    <circle cx="330" cy="304" r="8" fill="#38bdf8" filter="url(#fv-glow)"/>
    <circle cx="330" cy="304" r="4" fill="#ffffff"/>

    <!-- Node: Mid-Stem Junction -->
    <circle cx="163" cy="252" r="9" fill="#2563eb" filter="url(#fv-glow)"/>
    <circle cx="163" cy="252" r="4" fill="#ffffff"/>
  </g>
</svg>
